name: Udrul til SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sitet ligger i mappen fitbase.dk/public_html på FTP-kontoen (indtil 2. nov. 2026: frederikb7.sg-host.com).
# Skiftes hoveddomænet igen, omdøber SiteGround mappen – ret så SITE_DIR her.
env:
  SITE_DIR: fitbase.dk/public_html
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stop, hvis mappen ikke er en WordPress-installation – ellers ville vi uploade til en tom mappe.
      - name: Tjek at mappen findes på serveren
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if ! curl -sS -k --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only \
               "ftp://$FTP_SERVER:21/$SITE_DIR/" | grep -qx "wp-config.php"; then
            echo "::error::Fandt ikke $SITE_DIR/wp-config.php på FTP-serveren. Mapper i roden:"
            curl -sS -k --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only "ftp://$FTP_SERVER:21/" || true
            exit 1
          fi

      - name: Udrul pluginnet
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./wp-content/plugins/playform-feeds/
          server-dir: ${{ env.SITE_DIR }}/wp-content/plugins/playform-feeds/
          dangerous-clean-slate: false

      - name: Udrul temaet
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./wp-content/themes/playform/
          server-dir: ${{ env.SITE_DIR }}/wp-content/themes/playform/
          dangerous-clean-slate: false

      # Til sidst: nyt udrulnings-id. Først når det skifter, kører siden sine opdateringer
      # (se themes/playform/inc/setup.php), så de aldrig kører med halvt uploadede filer.
      - name: Marker udrulningen som færdig
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "${GITHUB_SHA}-${GITHUB_RUN_ID}" > playform-deploy.txt
          curl -sS -k --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" -T playform-deploy.txt \
            "ftp://$FTP_SERVER:21/$SITE_DIR/wp-content/playform-deploy.txt"

      # Besøg siden uden om cachen (REST-API'et caches ikke). Det kører opdateringerne med det samme,
      # og de tømmer SiteGrounds sidecache (playform_purge_cache), så ændringer ses straks.
      - name: Kør opdateringer og tøm cachen
        run: |
          sleep 3
          for i in 1 2 3; do
            code=$(curl -s -D hdr.txt -o /dev/null -w "%{http_code}" --max-time 240 "https://fitbase.dk/wp-json/?pf_deploy=${GITHUB_RUN_ID}-$i" -H "Cache-Control: no-cache")
            echo "Svar: $code"
            grep -i "x-pf-" hdr.txt || echo "(ingen x-pf-headere)"
            css=$(grep -i "^x-pf-css:" hdr.txt | tr -d '\r' | awk '{print $2}')
            [ "$code" = "200" ] && break
            sleep 10
          done
