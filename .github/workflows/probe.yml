name: Probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for u in https://kitzhen.dk/ https://kitzhen.dk/wp-sitemap.xml https://kitzhen.dk/wp-sitemap-posts-page-1.xml https://kitzhen.dk/wp-sitemap-taxonomies-product_cat-1.xml https://kitzhen.dk/wp-sitemap-posts-product-1.xml https://kitzhen.dk/robots.txt https://fitbase.dk/wp-sitemap.xml https://pizzalicious.dk/wp-sitemap.xml https://frederikb12.sg-host.com/; do
            echo "== $u"; curl -sS --http1.1 -o body.txt -D - -w "code %{http_code} time %{time_total} size %{size_download}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" "$u" | grep -i "^HTTP\|^code\|content-type\|x-\|cf-\|server"; head -c 400 body.txt; echo
          done
