name: Probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          curl -sS -o /dev/null -w "curl %{http_code} %{url_effective}\n" -A "Mozilla/5.0 (compatible; PlayformAudit/1.0)" https://kitzhen.dk/wp-sitemap.xml
          curl -sS -o /dev/null -w "curl-ua2 %{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36" https://kitzhen.dk/wp-sitemap.xml
          python3 - <<'PY'
          import urllib.request,ssl
          try:
              r=urllib.request.urlopen(urllib.request.Request('https://kitzhen.dk/wp-sitemap.xml',headers={'User-Agent':'Mozilla/5.0 (compatible; PlayformAudit/1.0)','Accept-Encoding':'gzip'}),timeout=40,context=ssl.create_default_context()); print('py',r.status,r.headers.get('Content-Encoding'))
          except Exception as e: print('py-err',repr(e))
          PY
