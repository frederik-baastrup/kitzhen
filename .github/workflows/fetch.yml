name: Hent butikssider
on:
  push:
    branches: [shop-pages]
    paths: [urls.txt, fetch.py, fetch2.py, eans.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch2.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add pages3.json && git commit -qm "Butikssider hentet [skip ci]" && git push -q
